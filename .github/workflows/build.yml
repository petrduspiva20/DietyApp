name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link Node binary globally for Xcode
        run: |
          NODE_PATH=$(which node)
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $NODE_PATH /usr/local/bin/node
          echo "NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Project
        run: |
          cd ios
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme DietyApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/DietyApp.xcarchive \
            NODE_BINARY="${{ env.NODE_BINARY }}" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Unsigned IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/DietyApp.xcarchive/Products/Applications/*.app Payload/
          zip -r DietyApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietyApp-Unsigned
          path: ios/DietyApp.ipa
