name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild Expo iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Export JS Bundle for iOS
        run: |
          mkdir -p ios/main.jsbundle
          npx expo export:embed \
            --platform ios \
            --dev false \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/

      - name: Build Xcode Project (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace DietyApp.xcworkspace \
                     -scheme DietyApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     SKIP_BUNDLING=1

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/DietyApp.app Payload/
          zip -r DietyApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietyApp-Unsigned
          path: DietyApp-Unsigned.ipa
