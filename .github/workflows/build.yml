name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Export Expo Bundle
        run: |
          npx expo export --platform ios --output-dir dist

      - name: Move Bundle to iOS App
        run: |
          mkdir -p ios/DietyApp
          cp -r dist/_expo/static/js/ios/*.js ios/DietyApp/main.jsbundle || cp dist/bundles/ios-*.js ios/DietyApp/main.jsbundle || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Project (Debug)
        run: |
          xcodebuild -workspace ios/DietyApp.xcworkspace \
                     -scheme DietyApp \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     EXPANDED_CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
                     -derivedDataPath build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/DietyApp.app Payload/
          zip -r DietyApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietyApp-Unsigned
          path: DietyApp.ipa
